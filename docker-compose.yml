services:
  mysql:
    image: mysql:8.4
    container_name: flashsale-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flashsale
      MYSQL_USER: flashsale
      MYSQL_PASSWORD: flashsale_password
      MYSQL_ROOT_PASSWORD: root_password
    command: ["--default-time-zone=+07:00", "--max-connections=500"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: flashsale-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./FlashSale
    image: flashsale-service:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: flashsale
      MYSQL_USERNAME: flashsale
      MYSQL_PASSWORD: flashsale_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-please-change-me-32bytes}
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      APP_SEED_DEMO_USERS: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Scale to prove the design is multi-instance safe:
    #   docker compose up -d --scale app=3   (drop the host port mapping first)

volumes:
  mysql_data:
  redis_data:
