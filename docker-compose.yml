services:
  mysql:
    image: mysql:8.4
    container_name: flashsale-mysql
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flashsale}
      MYSQL_USER: ${MYSQL_USER:-flashsale_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-P@ssword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-P@ssword}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-P@ssword}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-P@ssword}
      FLASHSALE_DB_PASSWORD: ${FLASHSALE_DB_PASSWORD:-P@ssword}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-P@ssword}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-P@ssword}
    command:
      - "--default-time-zone=${MYSQL_DEFAULT_TIMEZONE_OFFSET:-+07:00}"
      - "--max-connections=${MYSQL_MAX_CONNECTIONS:-500}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: flashsale-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flashsale-rabbitmq
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      RABBITMQ_DEFAULT_USER: flashsale
      RABBITMQ_DEFAULT_PASS: flashsale
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: flashsale-kafka
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flashsale-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"

  authentication:
    build:
      context: ./Authentication
    image: authentication-service:local
    container_name: authentication
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SERVER_PORT: ${AUTHENTICATION_PORT:-8081}
      MYSQL_SCHEMA: ${AUTHENTICATION_SCHEMA:-authentication}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flashsale}
      MYSQL_USERNAME: authentication_user
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-P@ssword}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_TOPIC: ${KAFKA_NOTIFICATION_TOPIC:-notification.requested}
      KAFKA_RELOAD_CONFIG_TOPIC: ${KAFKA_RELOAD_CONFIG_TOPIC:-service.config.reload}
      JWT_SECRET: ${JWT_SECRET:-2d7d27dba2c321d04f8b8dbdcdd1f9ef57811db298bc36375f98a169aa102409}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${AUTHENTICATION_PORT:-8081}:${AUTHENTICATION_PORT:-8081}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${AUTHENTICATION_PORT:-8081}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 20

  flashsale:
    build:
      context: ./FlashSale
    image: flashsale-service:local
    container_name: flashsale
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      MYSQL_SCHEMA: ${FLASHSALE_SCHEMA:-flashsale}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flashsale}
      MYSQL_USERNAME: flashsale_user
      MYSQL_PASSWORD: ${FLASHSALE_DB_PASSWORD:-P@ssword}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_RELOAD_CONFIG_TOPIC: ${KAFKA_RELOAD_CONFIG_TOPIC:-service.config.reload}
      JWT_SECRET: ${JWT_SECRET:-2d7d27dba2c321d04f8b8dbdcdd1f9ef57811db298bc36375f98a169aa102409}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_SEED_DEMO_USERS: "true"
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-flashsale}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-flashsale}
      PAYMENT_COMMAND_QUEUE: payment.commands
      KAFKA_PAYMENT_STATUS_SYNC_TOPIC: payment.status.sync
    ports:
      - "${FLASHSALE_PORT:-8080}:${FLASHSALE_PORT:-8080}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${FLASHSALE_PORT:-8080}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 20
    # Scale to prove the design is multi-instance safe:
    #   docker compose up -d --scale app=3   (drop the host port mapping first)

  notification:
    build:
      context: ./Notification
    image: notification-service:local
    container_name: notification
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SERVER_PORT: ${NOTIFICATION_PORT:-8082}
      MYSQL_SCHEMA: ${NOTIFICATION_SCHEMA:-notification}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flashsale}
      MYSQL_USERNAME: notification_user
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-P@ssword}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_TOPIC: ${KAFKA_NOTIFICATION_TOPIC:-notification.requested}
      KAFKA_NOTIFICATION_GROUP_ID: ${NOTIFICATION_GROUP_ID:-notification-service}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${NOTIFICATION_PORT:-8082}:${NOTIFICATION_PORT:-8082}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${NOTIFICATION_PORT:-8082}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 20

  payment:
    build:
      context: ./Payment
    image: payment-service:local
    container_name: payment
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SERVER_PORT: ${PAYMENT_PORT:-8083}
      MYSQL_SCHEMA: ${PAYMENT_SCHEMA:-payment}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USERNAME: payment_user
      MYSQL_PASSWORD: ${PAYMENT_DB_PASSWORD:-P@ssword}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-flashsale}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-flashsale}
      PAYMENT_COMMAND_QUEUE: payment.commands
    ports:
      - "${PAYMENT_PORT:-8083}:${PAYMENT_PORT:-8083}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${PAYMENT_PORT:-8083}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 20

  warehouse:
    build:
      context: ./Warehouse
    image: warehouse-service:local
    container_name: warehouse
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SERVER_PORT: ${WAREHOUSE_PORT:-8084}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${WAREHOUSE_DATABASE:-warehouse}
      MYSQL_USERNAME: warehouse_user
      MYSQL_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-P@ssword}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_GROUP_ID: warehouse-status
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-flashsale}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-flashsale}
    ports:
      - "${WAREHOUSE_PORT:-8084}:${WAREHOUSE_PORT:-8084}"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${WAREHOUSE_PORT:-8084}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 20

  scheduler:
    build:
      context: ./Scheduler
    image: scheduler-service:local
    container_name: scheduler
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SERVER_PORT: ${SCHEDULER_PORT:-8086}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_PAYMENT_STATUS_SYNC_TOPIC: ${KAFKA_PAYMENT_STATUS_SYNC_TOPIC:-payment.status.sync}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${SCHEDULER_PORT:-8086}:${SCHEDULER_PORT:-8086}"

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  rabbitmq_data:
