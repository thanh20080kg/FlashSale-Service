spring:
  application:
    name: FlashSale
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_SCHEMA:flashsale}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    username: ${MYSQL_USERNAME:flashsale_user}
    password: ${MYSQL_PASSWORD:P@ssword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # The purchase transaction is short (4 statements). Sized for ~500 TPS:
      # 500 TPS * ~8ms in-transaction time ~= 4 busy connections, 60 leaves headroom
      # for the listing endpoint, the sync worker and traffic spikes.
      maximum-pool-size: ${DB_POOL_SIZE:60}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${MYSQL_SCHEMA:flashsale}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: 16
          min-idle: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: latest
      group-id: ${KAFKA_MAINTENANCE_GROUP_ID:flashsale-maintenance-${HOSTNAME:local}}
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:2d7d27dba2c321d04f8b8dbdcdd1f9ef57811db298bc36375f98a169aa102409}
  web:
    error:
      include-message: never

server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
    accept-count: 200
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Every date/time decision (slot window, "one purchase per day") resolves against
  # this zone, never the JVM default, so all instances agree regardless of host TZ.
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  insecure-default-jwt-secret: local-dev-secret-please-change-me-32bytes
  auth:
    token-ttl: 24h
    otp-ttl: 5m
    otp-max-attempts: 5
    registration-ttl: 1h
  sale:
    current-items-cache-ttl: ${SALE_LISTING_CACHE_TTL:2s}
  inventory-sync:
    enabled: ${INVENTORY_SYNC_ENABLED:true}
    interval: 1s
    batch-size: 200
    max-attempts: 10
    retry-backoff: 5s
  maintenance:
    kafka-topic: ${KAFKA_MAINTENANCE_TOPIC:maintenance.config.reload}
    kafka-group-id: ${KAFKA_MAINTENANCE_GROUP_ID:flashsale-maintenance-${HOSTNAME:local}}

logging:
  level:
    root: INFO
