spring:
  application:
    name: FlashSale
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_SCHEMA:flashsale}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    username: ${MYSQL_USERNAME:flashsale_user}
    password: ${MYSQL_PASSWORD:P@ssword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
        type:
          preferred_uuid_jdbc_type: CHAR
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${MYSQL_SCHEMA:flashsale}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: 16
          min-idle: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: latest
      group-id: ${KAFKA_MAINTENANCE_GROUP_ID:flashsale-service}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flashsale}
    password: ${RABBITMQ_PASSWORD:flashsale}
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:2d7d27dba2c321d04f8b8dbdcdd1f9ef57811db298bc36375f98a169aa102409}
  web:
    error:
      include-message: never

server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
    accept-count: 200
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    token-ttl: 24h
    otp-ttl: 5m
    otp-max-attempts: 5
    registration-ttl: 1h
  purchase:
    current-items-cache-ttl: ${SALE_LISTING_CACHE_TTL:2s}
    limit-purchase-cache-ttl: ${SALE_LISTING_CACHE_TTL:2s}
  warehouse:
    queue: ${WAREHOUSE_INVENTORY_QUEUE:warehouse.inventory.commands}
    status-sync-queue: ${WAREHOUSE_STATUS_SYNC_QUEUE:flashsale.purchase-status.sync}
    timeout: ${WAREHOUSE_TIMEOUT:15s}
  payment:
    queue: ${PAYMENT_COMMAND_QUEUE:payment.commands}
    timeout: ${PAYMENT_TIMEOUT:15s}
    sync-age: ${PAYMENT_SYNC_AGE:5m}
    sync-batch-size: ${PAYMENT_SYNC_BATCH_SIZE:100}
  kafka-topic:
    trigger-reload: ${KAFKA_RELOAD_CONFIG_TOPIC:service.config.reload}
    quota-reload-topic: ${KAFKA_QUOTA_RELOAD_TOPIC:flashsale.quota.reload}
    payment-status-sync: ${KAFKA_PAYMENT_STATUS_SYNC_TOPIC:payment.status.sync}

logging:
  level:
    root: INFO
