# Demo flash sale configuration.
#
# It lives in Liquibase rather than in Java so the requirement "all flash sale configuration is
# managed in the database" holds literally: this file only bootstraps a first dataset, and
# everything in it can be changed afterwards through /api/v1/admin without a redeploy.
#
# The "All Day Showcase" slot exists so `GET /api/v1/flash-sales/current` returns something no
# matter what time a reviewer runs the project; the other slots are realistic windows, including
# one that deliberately wraps past midnight.
databaseChangeLog:
  - changeSet:
      id: 003-01-seed-products
      author: flashsale
      context: "!no-seed"
      changes:
        - loadData:
            tableName: products
            file: db/changelog/data/products.csv
            separator: ","
            columns:
              - column: { name: id, type: STRING }
              - column: { name: sku, type: STRING }
              - column: { name: name, type: STRING }
              - column: { name: active, type: BOOLEAN }

  - changeSet:
      id: 003-02-seed-inventories
      author: flashsale
      context: "!no-seed"
      changes:
        - loadData:
            tableName: inventories
            file: db/changelog/data/inventories.csv
            separator: ","
            columns:
              - column: { name: id, type: STRING }
              - column: { name: product_id, type: STRING }
              - column: { name: available_quantity, type: NUMERIC }
              - column: { name: sold_quantity, type: NUMERIC }

  - changeSet:
      id: 003-03-seed-slots
      author: flashsale
      context: "!no-seed"
      changes:
        - loadData:
            tableName: flash_sale_slots
            file: db/changelog/data/flash_sale_slots.csv
            separator: ","
            columns:
              - column: { name: id, type: STRING }
              - column: { name: name, type: STRING }
              - column: { name: start_time, type: STRING }
              - column: { name: end_time, type: STRING }
              - column: { name: active, type: BOOLEAN }

  - changeSet:
      id: 003-04-seed-items
      author: flashsale
      context: "!no-seed"
      changes:
        - loadData:
            tableName: flash_sale_items
            file: db/changelog/data/flash_sale_items.csv
            separator: ","
            columns:
              - column: { name: id, type: STRING }
              - column: { name: slot_id, type: STRING }
              - column: { name: product_id, type: STRING }
              - column: { name: amount, type: NUMERIC }
              - column: { name: quantity, type: NUMERIC }
              - column: { name: active, type: BOOLEAN }
