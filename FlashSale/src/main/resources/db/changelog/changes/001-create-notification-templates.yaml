databaseChangeLog:
  - changeSet:
      id: 001-create-notification-templates
      author: flashsale
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: notification_templates
      changes:
        - createTable:
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: varchar(100)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_notification_template_code }
              - column:
                  name: content
                  type: clob
                  constraints: { nullable: false }
              - column:
                  name: type
                  type: varchar(20)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: datetime
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: datetime
                  constraints: { nullable: false }
        - insert:
            tableName: notification_templates
            columns:
              - column: { name: id, value: "3e4f2a90-7658-4f03-bf08-000000000001" }
              - column: { name: code, value: AUTH_REGISTER_EMAIL_OTP }
              - column: { name: content, value: "Your FlashSale verification code is {{otp}}." }
              - column: { name: type, value: EMAIL }
              - column: { name: created_at, valueDate: "2026-01-01T00:00:00" }
              - column: { name: updated_at, valueDate: "2026-01-01T00:00:00" }

        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: channel
                  type: varchar(20)
                  constraints: { nullable: false }
              - column:
                  name: identifier
                  type: varchar(190)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_user_identifier }
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints: { nullable: false }
              - column:
                  name: verified
                  type: boolean
                  constraints: { nullable: false }
              - column:
                  name: role
                  type: varchar(20)
                  defaultValue: BUYER
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: datetime
                  constraints: { nullable: false }

        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: varchar(36)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_customer_user }
              - column:
                  name: display_name
                  type: varchar(100)
              - column:
                  name: balance
                  type: decimal(19,2)
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: datetime
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: customers
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_customer_user

        - createTable:
            tableName: otp_challenges
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: channel
                  type: varchar(20)
                  constraints: { nullable: false }
              - column:
                  name: identifier
                  type: varchar(190)
                  constraints: { nullable: false }
              - column:
                  name: purpose
                  type: varchar(30)
                  constraints: { nullable: false }
              - column:
                  name: code_hash
                  type: varchar(255)
                  constraints: { nullable: false }
              - column:
                  name: expires_at
                  type: datetime
                  constraints: { nullable: false }
              - column:
                  name: consumed
                  type: boolean
                  constraints: { nullable: false }
        - createIndex:
            tableName: otp_challenges
            indexName: idx_otp_lookup
            columns:
              - column: { name: identifier }
              - column: { name: purpose }
              - column: { name: consumed }

        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: sku
                  type: varchar(64)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_product_sku }
              - column:
                  name: name
                  type: varchar(200)
                  constraints: { nullable: false }
              - column:
                  name: active
                  type: boolean
                  constraints: { nullable: false }

        - createTable:
            tableName: inventories
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: product_id
                  type: varchar(36)
                  constraints: { nullable: false, unique: true, uniqueConstraintName: uk_inventory_product }
              - column:
                  name: available_quantity
                  type: bigint
                  constraints: { nullable: false }
              - column:
                  name: sold_quantity
                  type: bigint
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: inventories
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_inventory_product

        - createTable:
            tableName: flash_sale_slots
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: varchar(100)
                  constraints: { nullable: false }
              - column:
                  name: start_time
                  type: time
                  constraints: { nullable: false }
              - column:
                  name: end_time
                  type: time
                  constraints: { nullable: false }
              - column:
                  name: active
                  type: boolean
                  constraints: { nullable: false }

        - createTable:
            tableName: flash_sale_items
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: slot_id
                  type: varchar(36)
                  constraints: { nullable: false }
              - column:
                  name: product_id
                  type: varchar(36)
                  constraints: { nullable: false }
              - column:
                  name: amount
                  type: decimal(19,2)
                  constraints: { nullable: false }
              - column:
                  name: quantity
                  type: bigint
                  constraints: { nullable: false }
              - column:
                  name: remaining_quantity
                  type: bigint
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: flash_sale_items
            columnNames: slot_id, product_id
            constraintName: uk_slot_product
        - addForeignKeyConstraint:
            baseTableName: flash_sale_items
            baseColumnNames: slot_id
            referencedTableName: flash_sale_slots
            referencedColumnNames: id
            constraintName: fk_flash_sale_item_slot
        - addForeignKeyConstraint:
            baseTableName: flash_sale_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_flash_sale_item_product

        - createTable:
            tableName: flash_sale_purchases
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: customer_id
                  type: varchar(36)
                  constraints: { nullable: false }
              - column:
                  name: flash_sale_item_id
                  type: varchar(36)
                  constraints: { nullable: false }
              - column:
                  name: amount
                  type: decimal(19,2)
                  constraints: { nullable: false }
              - column:
                  name: purchase_date
                  type: date
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: datetime
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: flash_sale_purchases
            columnNames: customer_id, purchase_date
            constraintName: uk_customer_purchase_day
        - addForeignKeyConstraint:
            baseTableName: flash_sale_purchases
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_purchase_customer
        - addForeignKeyConstraint:
            baseTableName: flash_sale_purchases
            baseColumnNames: flash_sale_item_id
            referencedTableName: flash_sale_items
            referencedColumnNames: id
            constraintName: fk_purchase_flash_sale_item
        - insert:
            tableName: notification_templates
            columns:
              - column: { name: id, value: "3e4f2a90-7658-4f03-bf08-000000000002" }
              - column: { name: code, value: AUTH_REGISTER_SMS_OTP }
              - column: { name: content, value: "Your FlashSale verification code is {{otp}}" }
              - column: { name: type, value: SMS }
              - column: { name: created_at, valueDate: "2026-01-01T00:00:00" }
              - column: { name: updated_at, valueDate: "2026-01-01T00:00:00" }
