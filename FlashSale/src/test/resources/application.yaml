spring:
  kafka:
    consumer:
      group-id: flashsale-test
    listener:
      auto-startup: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: test-secret-key-with-at-least-32-bytes-long
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  datasource:
    url: jdbc:h2:mem:flashsale-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # Concurrency tests fire hundreds of threads at once.
      maximum-pool-size: 40
      connection-timeout: 30000
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: PUBLIC

app:
  timezone: Asia/Ho_Chi_Minh
  payment:
    queue: payment.commands.test
    timeout: 1s
    sync-batch-size: 10
  kafka-topic:
    payment-status-sync: payment.status.sync.test
    trigger-reload: service.config.reload.test
    quota-reload-topic: flashsale.quota.reload.test
  warehouse:
    queue: warehouse.inventory.commands.test
    status-sync-queue: flashsale.purchase-status.sync.test
    timeout: 1s
  seed:
    demo-users: false
  inventory-sync:
    # Tests drive the outbox by calling processPendingBatch() directly so assertions stay
    # deterministic; a background scheduler would race with them.
    enabled: false
  rate-limit:
    # Off by default so functional tests are not throttled. RateLimiterTest turns it back on.
    enabled: false
    rules:
      auth-login-identifier:
        limit: 3
        window: 15m

logging:
  level:
    root: warn
    com.shiro.flashsale: info
    org.testcontainers: warn
    liquibase: warn
