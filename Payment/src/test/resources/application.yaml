spring:
  datasource:
    url: jdbc:h2:mem:payment-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    listener:
      simple:
        auto-startup: false
app:
  rabbit-queue:
    payment-command: payment.commands.test
